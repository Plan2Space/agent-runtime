name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # the isolated evaluator is platform-sensitive (paths, native APIs)
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (suite inteira, exceto a verificação de instalação, que tem o próprio job)
        run: python -m pytest -q --ignore=tests/install

  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ambiente de verificação com dependências fixas
        run: python -m pip install --quiet -r scripts/verify-requirements.txt
      - name: Build do wheel
        run: |
          python -m pip install --quiet build
          python -m pip wheel . --no-deps -w dist
      - name: Verificação do pacote instalado (suíte de contrato, fora do checkout)
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python scripts/verify_install.py --wheel dist/agent_runtime-${VERSION}-py3-none-any.whl --expect-version "$VERSION"
      - name: Testes da própria verificação (negativos incluídos)
        run: python -m pytest -q tests/install
